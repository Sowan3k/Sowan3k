name: Contribution snake

# Draws the animated contribution graph shown at the bottom of the profile README.
# It writes two SVG files to the "output" branch once a day.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b7791f&color_dots=#ebedf0,#f6e3bd,#f0cd8a,#eab85a,#d99a2b
            dist/snake-dark.svg?color_snake=#f7c873&color_dots=#161d2b,#3d3018,#6e5522,#a57d30,#f2b34a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
