name: Contribution snake

# Draws the animated contribution graph shown at the bottom of the profile README.
# It writes two SVG files to the "output" branch once a day.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#333333&color_dots=#e0e0e0,#c0c0c0,#a0a0a0,#808080,#606060
            dist/snake-dark.svg?color_snake=#d9d9d9&color_dots=#2a2a2a,#404040,#606060,#808080,#a0a0a0

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
