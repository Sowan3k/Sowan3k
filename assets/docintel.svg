<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" role="img" aria-labelledby="t d">
<title id="t">DocIntel, an AI document intelligence system</title>
<desc id="d">Reads invoices from PDFs, scans, phone photos, Excel and CSV. A scan line passes over an invoice and eight fields turn green. Pipeline: ingest, OCR, extract, validate, review and search. All fields correct on 91 of 91 synthetic invoices, 439 tests in CI with 95% coverage, 12 of 12 planted errors caught, about 0.0015 US dollars per invoice.</desc>
