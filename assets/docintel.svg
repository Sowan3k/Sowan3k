<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">DocIntel, an AI document intelligence system</title>
  <desc id="desc">Reads invoices from PDFs, scans, phone photos, Excel and CSV. Pipeline: ingest, OCR, extract, validate, review and search. All fields correct on 91 of 91 synthetic invoices, 439 tests in CI with 95% coverage, 12 of 12 planted errors caught, about 0.0015 US dollars per invoice.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="878" height="328" rx="16"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b34a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f2b34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b34a" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#f2b34a"/>
      <stop offset="1" stop-color="#fbe3b3"/>
    </linearGradient>
    <clipPath id="track"><rect x="40" y="198" width="800" height="8"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .label { font-size: 11.5px; letter-spacing: 2.2px; fill: #f2b34a; }
    .chip { font-size: 10.5px; letter-spacing: 1.6px; fill: #7fd18b; text-anchor: middle; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; fill: #e8edf4; }
    .lead { font-size: 15px; fill: #c3ccd9; }
    .lead2 { font-size: 15px; fill: #8a96a8; }
    .stage { font-size: 13.5px; font-weight: 600; fill: #e8edf4; }
    .tool { font-size: 10.5px; fill: #8a96a8; }
    .big { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; fill: #e8edf4; }
    .cap { font-size: 10.5px; fill: #8a96a8; }
    .box { fill: #0f1520; stroke: #2b3549; stroke-width: 1.2; animation: box 6s linear infinite backwards; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.89s; } .d3 { animation-delay: 1.78s; }
    .d4 { animation-delay: 2.67s; } .d5 { animation-delay: 3.56s; }
    .runner { animation: run 6s linear infinite; }

    @keyframes run {
      0% { transform: translateX(0); opacity: 1; }
      80% { transform: translateX(880px); opacity: 1; }
      81%, 100% { transform: translateX(880px); opacity: 0; }
    }
    @keyframes box {
      0% { stroke: #2b3549; }
      3%, 18% { stroke: #f2b34a; }
      34%, 100% { stroke: #2b3549; }
    }
    @media (prefers-reduced-motion: reduce) {
      .box, .runner { animation: none; }
      .runner { display: none; }
    }
  </style>

  <rect x="1" y="1" width="878" height="328" rx="16" fill="#0b0f17"/>
  <g clip-path="url(#card)"><circle cx="820" cy="0" r="260" fill="url(#glow)"/></g>
  <rect x="1" y="1" width="878" height="328" rx="16" fill="none" stroke="#212a3a"/>

  <text class="mono label" x="40" y="48">FEATURED BUILD · NOVEMBER 2026</text>
  <rect x="728" y="32" width="112" height="24" rx="12" fill="#0f1a14" stroke="#28543a"/>
  <text class="mono chip" x="784" y="48">5-DAY BUILD</text>

  <text class="sans title" x="39" y="96">DocIntel</text>
  <text class="sans lead" x="40" y="126">Reads invoices from PDFs, scans, phone photos, Excel and CSV.</text>
  <text class="sans lead2" x="40" y="148">Gemini reads the fields. Python checks every number.</text>

  <!-- pipeline -->
  <path d="M40 202 H840" stroke="#212a3a" stroke-width="2"/>
  <g clip-path="url(#track)">
    <rect class="runner" x="-40" y="201" width="80" height="2" fill="url(#pulse)"/>
  </g>

  <rect class="box d1" x="40" y="172" width="148" height="60" rx="10"/>
  <rect class="box d2" x="203" y="172" width="148" height="60" rx="10"/>
  <rect class="box d3" x="366" y="172" width="148" height="60" rx="10"/>
  <rect class="box d4" x="529" y="172" width="148" height="60" rx="10"/>
  <rect class="box d5" x="692" y="172" width="148" height="60" rx="10"/>

  <text class="sans stage" x="54" y="197">Ingest</text>
  <text class="mono tool" x="54" y="216">PyMuPDF · OpenCV</text>
  <text class="sans stage" x="217" y="197">OCR</text>
  <text class="mono tool" x="217" y="216">Tesseract + vision</text>
  <text class="sans stage" x="380" y="197">Extract</text>
  <text class="mono tool" x="380" y="216">Gemini + evidence</text>
  <text class="sans stage" x="543" y="197">Validate</text>
  <text class="mono tool" x="543" y="216">11 rules in Decimal</text>
  <text class="sans stage" x="706" y="197">Review, search</text>
  <text class="mono tool" x="706" y="216">queue · pgvector</text>

  <!-- metrics -->
  <path d="M40 254 H840" stroke="#1a2230"/>
  <text class="sans big" x="40" y="287" fill="#f2b34a" style="fill:#f2b34a">91 / 91</text>
  <text class="mono cap" x="40" y="306">synthetic invoices, all fields</text>
  <text class="sans big" x="250" y="287">439</text>
  <text class="mono cap" x="250" y="306">tests in CI, 95% coverage</text>
  <text class="sans big" x="460" y="287">12 / 12</text>
  <text class="mono cap" x="460" y="306">planted errors caught</text>
  <text class="sans big" x="670" y="287">~$0.0015</text>
  <text class="mono cap" x="670" y="306">per invoice, paid tier</text>
</svg>
