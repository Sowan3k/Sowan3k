<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">DocIntel, an AI document intelligence system</title>
  <desc id="desc">Reads invoices from PDFs, scans, phone photos, Excel and CSV. Pipeline: ingest, OCR, extract, validate, review and search. All fields correct on 91 of 91 synthetic invoices, 439 tests in CI with 95% coverage, 12 of 12 planted errors caught, about 0.0015 US dollars per invoice.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="878" height="328" rx="15"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e062" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38e062" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e062" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#38e062"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <clipPath id="track"><rect x="40" y="198" width="800" height="8"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; }
    .label { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; fill: #38e062; }
    .chip { font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #38e062; text-anchor: middle; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -0.4px; fill: #fafafa; }
    .lead { font-size: 17.5px; fill: #fafafa; }
    .lead2 { font-size: 17.5px; font-style: italic; fill: #a1a1aa; }
    .stage { font-size: 15.5px; font-weight: 700; fill: #fafafa; }
    .tool { font-size: 12.5px; font-style: italic; fill: #a1a1aa; }
    .big { font-size: 28px; font-weight: 700; fill: #fafafa; }
    .cap { font-size: 12.5px; fill: #a1a1aa; }
    .box { fill: #101013; stroke: #27272a; stroke-width: 1.2; animation: box 6s linear infinite backwards; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.89s; } .d3 { animation-delay: 1.78s; }
    .d4 { animation-delay: 2.67s; } .d5 { animation-delay: 3.56s; }
    .runner { animation: run 6s linear infinite; }

    @keyframes run {
      0% { transform: translateX(0); opacity: 1; }
      80% { transform: translateX(880px); opacity: 1; }
      81%, 100% { transform: translateX(880px); opacity: 0; }
    }
    @keyframes box {
      0% { stroke: #27272a; }
      3%, 18% { stroke: #38e062; }
      34%, 100% { stroke: #27272a; }
    }
    @media (prefers-reduced-motion: reduce) {
      .box, .runner { animation: none; }
      .runner { display: none; }
    }
  </style>

  <rect x="1" y="1" width="878" height="328" rx="15" fill="#09090b"/>
  <g clip-path="url(#card)"><circle cx="820" cy="0" r="260" fill="url(#glow)"/></g>
  <rect x="1" y="1" width="878" height="328" rx="15" fill="none" stroke="#27272a"/>

  <text class="label" x="40" y="48">FEATURED BUILD · NOVEMBER 2026</text>
  <rect x="722" y="32" width="118" height="24" rx="12" fill="#0f2a17" stroke="#38e062" stroke-opacity="0.35"/>
  <text class="chip" x="781" y="48.5">5-DAY BUILD</text>

  <text class="title" x="39" y="98">DocIntel</text>
  <text class="lead" x="40" y="127">Reads invoices from PDFs, scans, phone photos, Excel and CSV.</text>
  <text class="lead2" x="40" y="150">Gemini reads the fields. Python checks every number.</text>

  <!-- pipeline -->
  <path d="M40 202 H840" stroke="#27272a" stroke-width="2"/>
  <g clip-path="url(#track)">
    <rect class="runner" x="-40" y="201" width="80" height="2" fill="url(#pulse)"/>
  </g>

  <rect class="box d1" x="40" y="172" width="148" height="60" rx="10"/>
  <rect class="box d2" x="203" y="172" width="148" height="60" rx="10"/>
  <rect class="box d3" x="366" y="172" width="148" height="60" rx="10"/>
  <rect class="box d4" x="529" y="172" width="148" height="60" rx="10"/>
  <rect class="box d5" x="692" y="172" width="148" height="60" rx="10"/>

  <text class="stage" x="54" y="198">Ingest</text>
  <text class="tool" x="54" y="217">PyMuPDF · OpenCV</text>
  <text class="stage" x="217" y="198">OCR</text>
  <text class="tool" x="217" y="217">Tesseract, vision</text>
  <text class="stage" x="380" y="198">Extract</text>
  <text class="tool" x="380" y="217">Gemini + evidence</text>
  <text class="stage" x="543" y="198">Validate</text>
  <text class="tool" x="543" y="217">11 Decimal rules</text>
  <text class="stage" x="706" y="198">Review, search</text>
  <text class="tool" x="706" y="217">queue · pgvector</text>

  <!-- metrics -->
  <path d="M40 254 H840" stroke="#27272a"/>
  <text class="big" x="40" y="289" style="fill:#38e062">91 / 91</text>
  <text class="cap" x="40" y="308">synthetic invoices correct</text>
  <text class="big" x="250" y="289">439</text>
  <text class="cap" x="250" y="308">tests in CI, 95% coverage</text>
  <text class="big" x="460" y="289">12 / 12</text>
  <text class="cap" x="460" y="308">planted errors caught</text>
  <text class="big" x="670" y="289">~$0.0015</text>
  <text class="cap" x="670" y="308">per invoice, paid tier</text>
</svg>
