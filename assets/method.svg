.pan { fill: #101013; stroke: #27272a; stroke-width: 1.2; animation: pan 7.0s linear infinite backwards; }
.ic { fill: #26a641; animation: ic 7.0s linear infinite backwards; }
@keyframes pan { 0% { stroke: #27272a; } 2%, 16% { stroke: #38e062; } 30%, 100% { stroke: #27272a; } }
@keyframes ic { 0% { fill: #26a641; } 2%, 16% { fill: #b9f6ca; } 30%, 100% { fill: #26a641; } }
.runner { animation: go 7.0s linear infinite; }
@keyframes go { 0% { transform: translateX(0); opacity: 1; } 85% { transform: translateX(766px); opacity: 1; } 86%, 100% { transform: translateX(766px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .motion { display: none; } }
