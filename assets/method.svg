<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">Six steps in order: requirements, rules in CLAUDE.md, phases in PHASES.md, build with Claude Code, log in STATUS.md and DECISIONS.md, then test in CI and ship.</desc>

  <defs>
    <clipPath id="track"><rect x="90" y="88" width="700" height="8"/></clipPath>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#606060" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#606060"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; }
    .label { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; fill: #606060; }
    .hint { font-size: 14px; font-style: italic; fill: #666666; text-anchor: end; }
    .step { font-size: 16.5px; font-weight: 700; fill: #333333; text-anchor: middle; }
    .sub { font-size: 13px; font-style: italic; fill: #666666; text-anchor: middle; }
    .num { font-size: 13px; font-weight: 700; fill: #666666; text-anchor: middle; animation: num 7s linear infinite backwards; }
    .node { fill: #f5f5f5; stroke: #c0c0c0; stroke-width: 1.2; animation: node 7s linear infinite backwards; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 1.08s; } .d3 { animation-delay: 2.16s; }
    .d4 { animation-delay: 3.25s; } .d5 { animation-delay: 4.33s; } .d6 { animation-delay: 5.41s; }
    .runner { animation: run 7s linear infinite; }

    @keyframes run {
      0% { transform: translateX(0); opacity: 1; }
      85% { transform: translateX(770px); opacity: 1; }
      86%, 100% { transform: translateX(770px); opacity: 0; }
    }
    @keyframes node {
      0% { stroke: #c0c0c0; fill: #f5f5f5; }
      2% { stroke: #333333; fill: #e0e0e0; }
      16% { stroke: #333333; fill: #e0e0e0; }
      30%, 100% { stroke: #c0c0c0; fill: #f5f5f5; }
    }
    @keyframes num {
      0% { fill: #666666; }
      2%, 16% { fill: #333333; }
      30%, 100% { fill: #666666; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .num, .runner { animation: none; }
      .runner { display: none; }
    }
  </style>

  <rect x="1" y="1" width="878" height="188" rx="6" fill="#f0f0f0" stroke="#d0d0d0"/>

  <text class="label" x="40" y="44">HOW I BUILD</text>
  <text class="hint" x="840" y="44">spec first, then phase by phase</text>

  <!-- track -->
  <path d="M90 92 H790" stroke="#d0d0d0" stroke-width="2"/>
  <g clip-path="url(#track)">
    <rect class="runner" x="20" y="91" width="70" height="2" fill="url(#pulse)"/>
  </g>

  <!-- nodes -->
  <circle class="node d1" cx="90" cy="92" r="17"/>
  <circle class="node d2" cx="230" cy="92" r="17"/>
  <circle class="node d3" cx="370" cy="92" r="17"/>
  <circle class="node d4" cx="510" cy="92" r="17"/>
  <circle class="node d5" cx="650" cy="92" r="17"/>
  <circle class="node d6" cx="790" cy="92" r="17"/>

  <text class="num d1" x="90" y="96.5">01</text>
  <text class="num d2" x="230" y="96.5">02</text>
  <text class="num d3" x="370" y="96.5">03</text>
  <text class="num d4" x="510" y="96.5">04</text>
  <text class="num d5" x="650" y="96.5">05</text>
  <text class="num d6" x="790" y="96.5">06</text>

  <text class="step" x="90" y="139">Requirements</text>
  <text class="step" x="230" y="139">Rules</text>
  <text class="step" x="370" y="139">Phases</text>
  <text class="step" x="510" y="139">Build</text>
  <text class="step" x="650" y="139">Log</text>
  <text class="step" x="790" y="139">Test, ship</text>

  <text class="sub" x="90" y="159">what it must do</text>
  <text class="sub" x="230" y="159">CLAUDE.md</text>
  <text class="sub" x="370" y="159">PHASES.md</text>
  <text class="sub" x="510" y="159">Claude Code</text>
  <text class="sub" x="650" y="159">STATUS · DECISIONS</text>
  <text class="sub" x="790" y="159">CI, then deploy</text>
</svg>
