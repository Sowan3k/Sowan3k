<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-labelledby="title desc">
  <title id="title">How I build</title>
  <desc id="desc">Six steps in order: requirements, rules in CLAUDE.md, phases in PHASES.md, build with Claude Code, log in STATUS.md and DECISIONS.md, then test in CI and ship.</desc>

  <defs>
    <clipPath id="track"><rect x="90" y="88" width="700" height="8"/></clipPath>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b34a" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#f2b34a"/>
      <stop offset="1" stop-color="#fbe3b3"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .label { font-size: 11.5px; letter-spacing: 2.2px; fill: #f2b34a; }
    .hint { font-size: 11px; fill: #56627a; text-anchor: end; }
    .step { font-size: 13.5px; font-weight: 600; fill: #e8edf4; text-anchor: middle; }
    .sub { font-size: 10.5px; fill: #8a96a8; text-anchor: middle; }
    .num { font-size: 11px; fill: #8a96a8; text-anchor: middle; animation: num 7s linear infinite backwards; }
    .node { fill: #0f1520; stroke: #2b3549; stroke-width: 1.2; animation: node 7s linear infinite backwards; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 1.08s; } .d3 { animation-delay: 2.16s; }
    .d4 { animation-delay: 3.25s; } .d5 { animation-delay: 4.33s; } .d6 { animation-delay: 5.41s; }
    .runner { animation: run 7s linear infinite; }

    @keyframes run {
      0% { transform: translateX(0); opacity: 1; }
      85% { transform: translateX(770px); opacity: 1; }
      86%, 100% { transform: translateX(770px); opacity: 0; }
    }
    @keyframes node {
      0% { stroke: #2b3549; fill: #0f1520; }
      2% { stroke: #f2b34a; fill: #2a2110; }
      16% { stroke: #f2b34a; fill: #2a2110; }
      30%, 100% { stroke: #2b3549; fill: #0f1520; }
    }
    @keyframes num {
      0% { fill: #8a96a8; }
      2%, 16% { fill: #f7c873; }
      30%, 100% { fill: #8a96a8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .num, .runner { animation: none; }
      .runner { display: none; }
    }
  </style>

  <rect x="1" y="1" width="878" height="188" rx="16" fill="#0b0f17" stroke="#212a3a"/>

  <text class="mono label" x="40" y="44">HOW I BUILD</text>
  <text class="mono hint" x="840" y="44">spec first, then phase by phase</text>

  <!-- track -->
  <path d="M90 92 H790" stroke="#212a3a" stroke-width="2"/>
  <g clip-path="url(#track)">
    <rect class="runner" x="20" y="91" width="70" height="2" fill="url(#pulse)"/>
  </g>

  <!-- nodes -->
  <circle class="node d1" cx="90" cy="92" r="17"/>
  <circle class="node d2" cx="230" cy="92" r="17"/>
  <circle class="node d3" cx="370" cy="92" r="17"/>
  <circle class="node d4" cx="510" cy="92" r="17"/>
  <circle class="node d5" cx="650" cy="92" r="17"/>
  <circle class="node d6" cx="790" cy="92" r="17"/>

  <text class="mono num d1" x="90" y="96">01</text>
  <text class="mono num d2" x="230" y="96">02</text>
  <text class="mono num d3" x="370" y="96">03</text>
  <text class="mono num d4" x="510" y="96">04</text>
  <text class="mono num d5" x="650" y="96">05</text>
  <text class="mono num d6" x="790" y="96">06</text>

  <text class="sans step" x="90" y="138">Requirements</text>
  <text class="sans step" x="230" y="138">Rules</text>
  <text class="sans step" x="370" y="138">Phases</text>
  <text class="sans step" x="510" y="138">Build</text>
  <text class="sans step" x="650" y="138">Log</text>
  <text class="sans step" x="790" y="138">Test, ship</text>

  <text class="mono sub" x="90" y="157">what it must do</text>
  <text class="mono sub" x="230" y="157">CLAUDE.md</text>
  <text class="mono sub" x="370" y="157">PHASES.md</text>
  <text class="mono sub" x="510" y="157">Claude Code</text>
  <text class="mono sub" x="650" y="157">STATUS · DECISIONS</text>
  <text class="mono sub" x="790" y="157">CI, then deploy</text>
</svg>
