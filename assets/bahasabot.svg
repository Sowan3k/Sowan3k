<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" role="img" aria-labelledby="t d">
<title id="t">BahasaBot, a Malay language learning platform</title>
<desc id="d">Final-year project, Silver Award at PIXEL 2026. A RAG chatbot, a course generator and an adaptive quiz. Two rows of squares race: a new course takes 78 seconds, the same topic again takes 280 milliseconds. Estimated cost about 0.11 US dollars per user per month. In-app rating 4.3 out of 5 from 30 users. 46 of 46 functional tests passed.</desc>
