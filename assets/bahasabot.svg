<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title desc">
  <title id="title">BahasaBot, a Malay language learning platform</title>
  <desc id="desc">Final-year project, Silver Award at PIXEL 2026. A RAG chatbot, a course generator and an adaptive quiz. A repeat course dropped from about 78 seconds to about 280 milliseconds. Projected cost about 0.11 US dollars per active user per month. In-app rating 4.3 out of 5 from 30 users. 46 of 46 functional tests passed.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="878" height="328" rx="6"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; }
    .label { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; fill: #606060; }
    .chip { font-size: 11.5px; font-weight: 700; letter-spacing: 1.8px; fill: #333333; text-anchor: middle; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -0.4px; fill: #333333; }
    .lead { font-size: 17.5px; fill: #333333; }
    .lead2 { font-size: 17.5px; font-style: italic; fill: #666666; }
    .stage { font-size: 15.5px; font-weight: 700; fill: #333333; }
    .tool { font-size: 12.5px; font-style: italic; fill: #666666; }
    .big { font-size: 28px; font-weight: 700; fill: #333333; }
    .cap { font-size: 12.5px; fill: #666666; }
    .box { fill: #f5f5f5; stroke: #d0d0d0; stroke-width: 1.2; }
    .dot { fill: #606060; animation: dot 1.4s ease-in-out infinite; }
    .dot2 { animation-delay: 0.2s; } .dot3 { animation-delay: 0.4s; }
    .live { fill: #606060; animation: live 2s ease-in-out infinite; }
    .bar { fill: #333333; transform-origin: 40px 0; animation: shrink 6s cubic-bezier(.6,0,.2,1) infinite; }

    @keyframes dot { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes shrink {
      0%, 22% { transform: scaleX(1); }
      42%, 88% { transform: scaleX(0.03); }
      100% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot, .live, .bar { animation: none; }
      .bar { transform: scaleX(0.03); }
    }
  </style>

  <rect x="1" y="1" width="878" height="328" rx="6" fill="#f0f0f0"/>
  <g clip-path="url(#card)"><circle cx="820" cy="0" r="260" fill="url(#glow)"/></g>
  <rect x="1" y="1" width="878" height="328" rx="6" fill="none" stroke="#d0d0d0"/>

  <text class="label" x="40" y="48">FINAL-YEAR PROJECT · SILVER AWARD, PIXEL 2026</text>
  <rect x="722" y="32" width="118" height="24" rx="5" fill="#e0e0e0" stroke="#c0c0c0"/>
  <circle class="live" cx="737" cy="44" r="3"/>
  <text class="chip" x="792" y="48.5">LIVE DEMO</text>

  <text class="title" x="39" y="98">BahasaBot</text>
  <text class="lead" x="40" y="127">Malay language learning platform for international students</text>
  <text class="lead2" x="40" y="150">at Malaysian public universities.</text>

  <!-- features -->
  <rect class="box" x="40" y="172" width="256" height="60" rx="5"/>
  <rect class="box" x="312" y="172" width="256" height="60" rx="5"/>
  <rect class="box" x="584" y="172" width="256" height="60" rx="5"/>

  <text class="stage" x="54" y="198">RAG chatbot</text>
  <circle class="dot" cx="262" cy="193" r="2.6"/>
  <circle class="dot dot2" cx="271" cy="193" r="2.6"/>
  <circle class="dot dot3" cx="280" cy="193" r="2.6"/>
  <text class="tool" x="54" y="217">LangChain · pgvector · SSE</text>

  <text class="stage" x="326" y="198">Course generator</text>
  <text class="tool" x="326" y="217">concurrent Gemini calls, cached</text>

  <text class="stage" x="598" y="198">Adaptive quiz</text>
  <text class="tool" x="598" y="217">BPS-1 to BPS-4, last 3 attempts</text>

  <!-- metrics -->
  <path d="M40 254 H840" stroke="#d0d0d0"/>
  <text class="big" x="40" y="289">78 s → 280 ms</text>
  <text class="cap" x="40" y="308">repeat course generation</text>
  <rect x="40" y="315" width="180" height="3" rx="1.5" fill="#d9d9d9"/>
  <rect class="bar" x="40" y="315" width="180" height="3" rx="1.5"/>

  <text class="big" x="285" y="289">~$0.11</text>
  <text class="cap" x="285" y="308">est. cost per user a month</text>
  <text class="big" x="480" y="289">4.3 / 5</text>
  <text class="cap" x="480" y="308">in-app rating, 30 users</text>
  <text class="big" x="670" y="289">46 / 46</text>
  <text class="cap" x="670" y="308">functional tests passed</text>
</svg>
