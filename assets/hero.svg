<style>
text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.n { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2,1.5,.4,1) backwards, wave4 7s linear infinite; }
.l4 { fill: #38e062; }
.l3 { fill: #26a641; animation-name: pop, wave3; }
.l2 { fill: #006d32; animation-name: pop, wave2; }
@keyframes pop { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.18); fill: #b9f6ca; } 100% { opacity: 1; transform: scale(1); } }
@keyframes wave4 { 0%, 9%, 100% { fill: #38e062; } 4% { fill: #b9f6ca; } }
@keyframes wave3 { 0%, 9%, 100% { fill: #26a641; } 4% { fill: #7ee2a0; } }
@keyframes wave2 { 0%, 9%, 100% { fill: #006d32; } 4% { fill: #26a641; } }
.noise { animation: tw 6s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.sweep { animation: sw 2.9s .45s linear both; }
@keyframes sw { 0% { transform: translateX(0); opacity: 0; } 6%, 94% { opacity: .85; } 100% { transform: translateX(631px); opacity: 0; } }
.rot { opacity: 0; animation: rot 16s linear infinite backwards; }
.r1 { opacity: 1; }
@keyframes rot { 0% { opacity: 0; transform: translateY(5px); } 3%, 22% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-5px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .motion { display: none; } }
</style>
