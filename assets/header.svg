<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Noor Mohammad Sowan</title>
  <desc id="desc">Software engineer in Dhaka. I build AI automation and full-stack systems. A status panel lists the DocIntel build: phases 0 to 7 done, 439 tests passed, 95% line coverage, 91 of 91 synthetic invoices correct, 89 decisions logged, deployed on Render and Vercel.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="878" height="318" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b3549"/>
    </pattern>
    <radialGradient id="dotfade" cx="0.82" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="880" height="320" fill="url(#dotfade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b34a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2b34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b34a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f7c873"/>
      <stop offset="1" stop-color="#f2b34a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .label { font-size: 11.5px; letter-spacing: 2.2px; fill: #f2b34a; }
    .name { font-size: 50px; font-weight: 700; letter-spacing: -1.2px; fill: #e8edf4; }
    .accent { fill: #f2b34a; }
    .tag { font-size: 16.5px; fill: #c3ccd9; }
    .rot { font-size: 12px; fill: #8a96a8; opacity: 0; animation: rot 16s linear infinite backwards; }
    .r1 { opacity: 1; animation-delay: 0s; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 8s; }
    .r4 { animation-delay: 12s; }
    .file { font-size: 11px; fill: #56627a; }
    .key { font-size: 12.5px; fill: #8a96a8; }
    .val { font-size: 12.5px; fill: #e8edf4; text-anchor: end; }
    .tick { fill: none; stroke: #7fd18b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ln { animation: 16s linear infinite; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    .l4 { animation-name: l4; } .l5 { animation-name: l5; } .l6 { animation-name: l6; }
    .cursor { fill: #f2b34a; animation: blink 1.1s steps(1) infinite; }
    .orbit { animation: orbit 11s linear infinite; }
    .breathe { animation: breathe 8s ease-in-out infinite; transform-origin: 740px 60px; }

    @keyframes rot {
      0% { opacity: 0; transform: translateY(5px); }
      3% { opacity: 1; transform: translateY(0); }
      22% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes l1 { 0%, 5% { opacity: 0; } 7.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l2 { 0%, 10% { opacity: 0; } 12.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l3 { 0%, 15% { opacity: 0; } 17.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l4 { 0%, 20% { opacity: 0; } 22.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l5 { 0%, 25% { opacity: 0; } 27.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l6 { 0%, 30% { opacity: 0; } 32.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    @keyframes breathe { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

    @media (prefers-reduced-motion: reduce) {
      .ln, .rot, .cursor, .orbit, .breathe { animation: none; }
      .orbit { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="878" height="318" rx="16" fill="#0b0f17"/>
  <g clip-path="url(#card)">
    <rect width="880" height="320" fill="url(#dots)" mask="url(#dotmask)"/>
    <circle class="breathe" cx="740" cy="60" r="300" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="878" height="318" rx="16" fill="none" stroke="#212a3a"/>
  <rect class="orbit" x="1" y="1" width="878" height="318" rx="16" fill="none" stroke="#f2b34a" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93" opacity="0.35" filter="url(#soft)"/>
  <rect class="orbit" x="1" y="1" width="878" height="318" rx="16" fill="none" stroke="#f7c873" stroke-width="1.4" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93"/>

  <!-- identity -->
  <text class="mono label" x="48" y="82">SOFTWARE ENGINEER · DHAKA, UTC+6</text>
  <text class="sans name" x="46" y="140">Noor Mohammad</text>
  <text class="sans name accent" x="46" y="196">Sowan</text>
  <text class="sans tag" x="48" y="236">I build AI automation and full-stack systems.</text>

  <path d="M48 262.5 l7 4.5 l-7 4.5 z" fill="#f2b34a"/>
  <text class="mono rot r1" x="64" y="271"><tspan font-weight="600" fill="#e8edf4">DocIntel</tspan> invoices read by Gemini, checked in Python</text>
  <text class="mono rot r2" x="64" y="271"><tspan font-weight="600" fill="#e8edf4">BahasaBot</tspan> RAG Malay tutor, Silver at PIXEL 2026</text>
  <text class="mono rot r3" x="64" y="271"><tspan font-weight="600" fill="#e8edf4">Virtual Zara</tspan> n8n agent across five business systems</text>
  <text class="mono rot r4" x="64" y="271"><tspan font-weight="600" fill="#e8edf4">ChargeWatch</tspan> Android battery alerts, no backend</text>

  <!-- status panel -->
  <rect x="508" y="40" width="332" height="240" rx="12" fill="#0f1520" stroke="#212a3a"/>
  <path d="M508 74 h332" stroke="#1a2230"/>
  <circle cx="528" cy="57" r="4" fill="#2b3549"/>
  <circle cx="542" cy="57" r="4" fill="#2b3549"/>
  <circle cx="556" cy="57" r="4" fill="#2b3549"/>
  <text class="mono file" x="820" y="61" text-anchor="end">docintel / STATUS.md</text>

  <g class="ln l1">
    <path class="tick" d="M528 99 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="104">phases 0 to 7</text>
    <text class="mono val" x="820" y="104">done</text>
  </g>
  <g class="ln l2">
    <path class="tick" d="M528 125 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="130">tests</text>
    <text class="mono val" x="820" y="130">439 passed</text>
  </g>
  <g class="ln l3">
    <path class="tick" d="M528 151 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="156">coverage</text>
    <text class="mono val" x="820" y="156">95% of lines</text>
  </g>
  <g class="ln l4">
    <path class="tick" d="M528 177 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="182">evaluation</text>
    <text class="mono val" x="820" y="182">91/91 synthetic invoices</text>
  </g>
  <g class="ln l5">
    <path class="tick" d="M528 203 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="208">decisions</text>
    <text class="mono val" x="820" y="208">89 logged</text>
  </g>
  <g class="ln l6">
    <path class="tick" d="M528 229 l3.2 3.2 l6 -7"/>
    <text class="mono key" x="550" y="234">deploy</text>
    <text class="mono val" x="820" y="234">render · vercel</text>
  </g>
  <rect class="cursor" x="527" y="248" width="7" height="13" rx="1"/>
</svg>
