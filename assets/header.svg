<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Noor Mohammad Sowan</title>
  <desc id="desc">Software engineer in Dhaka. I build AI automation and full-stack systems. A status panel lists the DocIntel build: phases 0 to 7 done, 439 tests passed, 95% line coverage, 91 of 91 synthetic invoices correct, 89 decisions logged, deployed on Render and Vercel.</desc>

  <defs>
    <clipPath id="card"><rect x="1" y="1" width="878" height="318" rx="15"/></clipPath>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="10" height="10" rx="2.5" fill="#17171b"/>
    </pattern>
    <radialGradient id="dotfade" cx="0.82" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="880" height="320" fill="url(#dotfade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e062" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38e062" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    text { font-family: 'Times New Roman', Times, 'Liberation Serif', 'Nimbus Roman', serif; }
    .label { font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; fill: #38e062; }
    .name { font-size: 52px; font-weight: 700; letter-spacing: -0.6px; fill: #fafafa; }
    .name2 { font-size: 52px; font-weight: 700; font-style: italic; letter-spacing: -0.6px; fill: #38e062; }
    .tag { font-size: 19px; fill: #fafafa; }
    .rot { font-size: 14.5px; fill: #a1a1aa; opacity: 0; animation: rot 16s linear infinite backwards; }
    .r1 { opacity: 1; animation-delay: 0s; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 8s; }
    .r4 { animation-delay: 12s; }
    .file { font-size: 13px; font-style: italic; fill: #a1a1aa; }
    .key { font-size: 15px; fill: #a1a1aa; }
    .val { font-size: 15px; font-weight: 700; fill: #fafafa; text-anchor: end; }
    .tick { fill: none; stroke: #38e062; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ln { animation: 16s linear infinite; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    .l4 { animation-name: l4; } .l5 { animation-name: l5; } .l6 { animation-name: l6; }
    .cursor { fill: #38e062; animation: blink 1.1s steps(1) infinite; }
    .orbit { animation: orbit 11s linear infinite; }
    .tw { animation: tw 6s ease-in-out infinite; }
    .breathe { animation: breathe 8s ease-in-out infinite; transform-origin: 740px 60px; }

    @keyframes rot {
      0% { opacity: 0; transform: translateY(5px); }
      3% { opacity: 1; transform: translateY(0); }
      22% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes l1 { 0%, 5% { opacity: 0; } 7.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l2 { 0%, 10% { opacity: 0; } 12.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l3 { 0%, 15% { opacity: 0; } 17.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l4 { 0%, 20% { opacity: 0; } 22.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l5 { 0%, 25% { opacity: 0; } 27.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes l6 { 0%, 30% { opacity: 0; } 32.5%, 91% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    @keyframes breathe { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

    @media (prefers-reduced-motion: reduce) {
      .ln, .rot, .cursor, .orbit, .breathe, .tw { animation: none; }
      .orbit { display: none; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="878" height="318" rx="15" fill="#09090b"/>
  <g clip-path="url(#card)">
    <circle class="breathe" cx="740" cy="60" r="300" fill="url(#glow)"/>
    <rect width="880" height="320" fill="url(#dots)" mask="url(#dotmask)"/>
    <g mask="url(#dotmask)">
    <rect class="tw" style="animation-delay:0.0s" x="520" y="114" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect x="492" y="142" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect x="548" y="2" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect class="tw" style="animation-delay:2.1s" x="772" y="16" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect x="478" y="100" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect x="478" y="184" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect class="tw" style="animation-delay:4.2s" x="856" y="296" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect x="674" y="2" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect x="478" y="268" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect class="tw" style="animation-delay:0.3s" x="520" y="268" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect x="716" y="2" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect x="478" y="128" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect class="tw" style="animation-delay:2.4s" x="646" y="2" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect x="506" y="44" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect x="478" y="58" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect class="tw" style="animation-delay:4.5s" x="478" y="240" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect x="576" y="296" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect x="562" y="296" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect class="tw" style="animation-delay:0.6s" x="478" y="170" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect x="506" y="142" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect x="478" y="254" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect class="tw" style="animation-delay:2.7s" x="688" y="2" width="10" height="10" rx="2.5" fill="#006d32"/>
    <rect x="562" y="310" width="10" height="10" rx="2.5" fill="#26a641"/>
    <rect x="478" y="142" width="10" height="10" rx="2.5" fill="#38e062"/>
    <rect class="tw" style="animation-delay:4.8s" x="688" y="310" width="10" height="10" rx="2.5" fill="#0e4429"/>
    <rect x="492" y="44" width="10" height="10" rx="2.5" fill="#006d32"/>
    </g>
  </g>
  <rect x="1" y="1" width="878" height="318" rx="15" fill="none" stroke="#27272a"/>
  <rect class="orbit" x="1" y="1" width="878" height="318" rx="15" fill="none" stroke="#38e062" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93" opacity="0.25" filter="url(#soft)"/>
  <rect class="orbit" x="1" y="1" width="878" height="318" rx="15" fill="none" stroke="#38e062" stroke-width="1.4" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93"/>

  <!-- identity -->
  <text class="label" x="48" y="80">SOFTWARE ENGINEER · DHAKA, UTC+6</text>
  <text class="name" x="46" y="138">Noor Mohammad</text>
  <text class="name2" x="46" y="192">Sowan</text>
  <text class="tag" x="48" y="236">I build AI automation and full-stack systems.</text>

  <path d="M48 263 l7 4.5 l-7 4.5 z" fill="#38e062"/>
  <text class="rot r1" x="64" y="272"><tspan font-weight="700" fill="#fafafa">DocIntel</tspan> invoices read by Gemini, checked in Python</text>
  <text class="rot r2" x="64" y="272"><tspan font-weight="700" fill="#fafafa">BahasaBot</tspan> RAG Malay tutor, Silver at PIXEL 2026</text>
  <text class="rot r3" x="64" y="272"><tspan font-weight="700" fill="#fafafa">Virtual Zara</tspan> n8n agent across five business systems</text>
  <text class="rot r4" x="64" y="272"><tspan font-weight="700" fill="#fafafa">ChargeWatch</tspan> Android battery alerts, no backend</text>

  <!-- status panel -->
  <rect x="536" y="40" width="304" height="240" rx="15" fill="#101013" stroke="#27272a"/>
  <path d="M536 74 h304" stroke="#1c1c21"/>
  <circle cx="556" cy="57" r="4" fill="#3f3f46"/>
  <circle cx="570" cy="57" r="4" fill="#3f3f46"/>
  <circle cx="584" cy="57" r="4" fill="#3f3f46"/>
  <text class="file" x="820" y="62" text-anchor="end">docintel / STATUS.md</text>

  <g class="ln l1">
    <path class="tick" d="M556 99 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="105">phases 0 to 7</text>
    <text class="val" x="820" y="105">done</text>
  </g>
  <g class="ln l2">
    <path class="tick" d="M556 125 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="131">tests</text>
    <text class="val" x="820" y="131">439 passed</text>
  </g>
  <g class="ln l3">
    <path class="tick" d="M556 151 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="157">coverage</text>
    <text class="val" x="820" y="157">95% of lines</text>
  </g>
  <g class="ln l4">
    <path class="tick" d="M556 177 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="183">evaluation</text>
    <text class="val" x="820" y="183">91 of 91 synthetic</text>
  </g>
  <g class="ln l5">
    <path class="tick" d="M556 203 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="209">decisions</text>
    <text class="val" x="820" y="209">89 logged</text>
  </g>
  <g class="ln l6">
    <path class="tick" d="M556 229 l3.2 3.2 l6 -7"/>
    <text class="key" x="578" y="235">deploy</text>
    <text class="val" x="820" y="235">Render · Vercel</text>
  </g>
  <rect class="cursor" x="555" y="248" width="7" height="13" rx="1"/>
</svg>
